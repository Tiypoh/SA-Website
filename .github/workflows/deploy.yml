name: Deploy Sequentially to Servers

on:
  push:
    branches:
      - main

jobs:
  deploy-server-1:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Home Server
        uses: easing-themes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY_HOME }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST_HOME }}
          REMOTE_USER: ${{ secrets.SERVER_USER_HOME }}
          SOURCE: "/"
          TARGET: "/var/www/sebringautomotive.shop"
          SCRIPT_AFTER: |
            git pull
            sudo chown -R www-data:www-data .
            echo "Deployment to Home Server complete!"

  deploy-server-2:
    # 'needs' ensures this job waits for deploy-server-1 to succeed
    needs: deploy-server-1
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GCloud Server
        uses: easing-themes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY_GCLOUD }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST_GCLOUD }}
          REMOTE_USER: ${{ secrets.SERVER_USER_GCLOUD }}
          SOURCE: "/"
          TARGET: "/var/www/html"
          SCRIPT_AFTER: |
            git pull
            sudo chown -R www-data:www-data .
            echo "Deployment to GCloud Server complete!"